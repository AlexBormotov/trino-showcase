version: 2

models:
  - name: metricflow_time_spine
    description: Daily date spine for MetricFlow. Ossie has no time spine concept, so it is defined in dbt.
    time_spine:
      standard_granularity_column: date_day
    columns:
      - name: date_day
        granularity: day
        data_tests: [unique, not_null]
