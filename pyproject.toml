[project]
name = "trino-showcase"
version = "0.1.0"
description = "Federated clinic data harmonization PoC: Trino, dbt, Apache Ossie, MetricFlow"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dbt-core==1.12.5",
    "dbt-trino==1.10.6",
    "dbt-metricflow[dbt-trino]==0.15.0",
    "pandas>=3.0.6",
    "numpy>=2.5.3",
    "pyarrow>=25.0.1",
    "psycopg[binary]>=3.3.6",
    "pymysql>=1.2.3",
    "pyiceberg[pyarrow,pyiceberg-core]>=0.12.0",
]

[dependency-groups]
dev = [
    "poethepoet",
    "pytest",
]

[tool.uv]
package = false

[tool.poe.tasks]
up = "docker compose up -d --wait"
down = "docker compose down"
reset = "docker compose down -v"
synthea = "python -m seed.synthea"
seed = "python -m seed"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["integration: needs the running docker compose stack and a loaded seed"]
