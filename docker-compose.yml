# Local stack. Credentials below are throwaway values for a laptop, not secrets.
# Host ports are shifted (1xxxx) to avoid clashes with other local stacks, and bound to
# 127.0.0.1: Trino has no authentication (ADR 0004), so it must not be reachable from the network.
name: trino-showcase

x-polaris-db: &polaris-db
  POLARIS_PERSISTENCE_TYPE: relational-jdbc
  POLARIS_PERSISTENCE_RELATIONAL_JDBC_DATABASE_TYPE: postgresql
  QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/polaris
  QUARKUS_DATASOURCE_USERNAME: postgres
  QUARKUS_DATASOURCE_PASSWORD: postgres

services:
  postgres:
    image: postgres:18.6
    mem_limit: 512m
    shm_size: 128mb
    ports: ["127.0.0.1:15432:5432"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      retries: 20

  mysql:
    image: mysql:8.4
    mem_limit: 1g
    ports: ["127.0.0.1:13306:3306"]
    environment:
      MYSQL_ROOT_PASSWORD: mysql
      MYSQL_DATABASE: clinic_b
    volumes:
      - ./infra/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pmysql"]
      interval: 5s
      retries: 30

  rustfs:
    image: rustfs/rustfs:1.0.1
    mem_limit: 512m
    ports: ["127.0.0.1:19000:9000", "127.0.0.1:19001:9001"]
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://127.0.0.1:9000/health"]
      interval: 5s
      retries: 20

  create-bucket:
    image: amazon/aws-cli:2.36.44
    depends_on:
      rustfs: {condition: service_healthy}
    environment:
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin
      AWS_ENDPOINT_URL: http://rustfs:9000
    entrypoint: ["/bin/sh", "-c", "aws s3 ls s3://warehouse || aws s3 mb s3://warehouse"]

  polaris-bootstrap:
    image: apache/polaris-admin-tool:1.8.0
    depends_on:
      postgres: {condition: service_healthy}
    environment: *polaris-db
    command: ["bootstrap", "--realm=POLARIS", "--credential=POLARIS,root,s3cr3t"]

  polaris:
    image: apache/polaris:1.8.0
    mem_limit: 1g
    ports: ["127.0.0.1:18181:8181", "127.0.0.1:18182:8182"]
    depends_on:
      polaris-bootstrap: {condition: service_completed_successfully}
      create-bucket: {condition: service_completed_successfully}
    environment:
      <<: *polaris-db
      POLARIS_REALM_CONTEXT_REALMS: POLARIS
      QUARKUS_OTEL_SDK_DISABLED: "true"
      # Polaris itself writes table metadata to RustFS with these keys.
      AWS_REGION: us-west-2
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin
      polaris.readiness.ignore-severe-issues: "true"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8182/q/health"]
      interval: 5s
      retries: 30
      start_period: 10s

  polaris-setup:
    image: alpine/curl:8.22.0
    depends_on:
      polaris: {condition: service_healthy}
    volumes:
      - ./infra/polaris/setup.sh:/setup.sh:ro
    entrypoint: ["/bin/sh", "/setup.sh"]

  trino:
    image: trinodb/trino:483
    mem_limit: 3g
    ports: ["127.0.0.1:18080:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      mysql: {condition: service_healthy}
      polaris-setup: {condition: service_completed_successfully}
    volumes:
      - ./infra/trino/catalog:/etc/trino/catalog:ro
      - ./infra/trino/access-control.properties:/etc/trino/access-control.properties:ro
      - ./infra/trino/rules.json:/etc/trino/rules.json:ro
      - ./infra/trino/event-listener.properties:/etc/trino/event-listener.properties:ro

  superset:
    build: ./infra/superset
    image: trino-showcase-superset:6.1.0
    mem_limit: 1536m
    ports: ["127.0.0.1:18088:8088"]
    depends_on:
      trino: {condition: service_healthy}
    volumes:
      - ./infra/superset/superset_config.py:/app/pythonpath/superset_config.py:ro
      - ./infra/superset/bootstrap.sh:/app/bootstrap.sh:ro
      - superset-data:/app/superset_home
    entrypoint: ["/bin/sh", "/app/bootstrap.sh"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8088/health"]
      interval: 10s
      retries: 30
      start_period: 60s

volumes:
  postgres-data:
  mysql-data:
  rustfs-data:
  superset-data:
