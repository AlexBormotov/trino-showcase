version: 0.2.0.dev0
name: clinic_analytics
description: >
  Metrics over the canonical clinic model, all tenants. This file is the single source of
  metric definitions: MetricFlow and BI definitions are generated from it.

# Conventions (see docs/adr/0003-ossie-as-metric-source.md):
# - a dataset's key field is named after the entity (encounter, claim, patient);
# - time fields set dimension.is_time explicitly;
# - each dataset with metrics declares its default time dimension in a DBT custom extension.

datasets:
  - name: encounter
    source: iceberg.marts.fct_encounter
    primary_key: [encounter]
    description: One row per clinical encounter.
    custom_extensions:
      - vendor_name: DBT
        data: '{"agg_time_dimension": "start_ts"}'
    fields:
      - name: encounter
        expression: {dialects: [{dialect: ANSI_SQL, expression: encounter_hk}]}
        datatype: String
      - name: patient
        expression: {dialects: [{dialect: ANSI_SQL, expression: patient_hk}]}
        datatype: String
      - name: patient_hk
        description: Patient key as a plain column, for distinct counts.
        expression: {dialects: [{dialect: ANSI_SQL, expression: patient_hk}]}
        datatype: String
      - name: tenant_id
        expression: {dialects: [{dialect: ANSI_SQL, expression: tenant_id}]}
        datatype: String
      - name: encounter_class
        expression: {dialects: [{dialect: ANSI_SQL, expression: encounter_class}]}
        datatype: String
      - name: start_ts
        expression: {dialects: [{dialect: ANSI_SQL, expression: start_ts}]}
        datatype: DateTime
        dimension: {is_time: true}
      - name: inpatient_stay
        description: 1 for inpatient encounters, else 0.
        expression: {dialects: [{dialect: ANSI_SQL, expression: inpatient_stay}]}
        datatype: Integer
      - name: length_of_stay_days
        description: Inpatient length of stay in days; NULL for other classes.
        expression: {dialects: [{dialect: ANSI_SQL, expression: length_of_stay_days}]}
        datatype: Decimal
      - name: readmitted_30d
        description: 1 if an inpatient stay is followed by another inpatient admission within 30 days of discharge.
        expression: {dialects: [{dialect: ANSI_SQL, expression: readmitted_30d}]}
        datatype: Integer

  - name: claim
    source: iceberg.marts.fct_claim
    primary_key: [claim]
    description: One row per claim. Synthea bills medications as separate claims on the same encounter.
    custom_extensions:
      - vendor_name: DBT
        data: '{"agg_time_dimension": "service_dt"}'
    fields:
      - name: claim
        expression: {dialects: [{dialect: ANSI_SQL, expression: claim_hk}]}
        datatype: String
      - name: patient
        expression: {dialects: [{dialect: ANSI_SQL, expression: patient_hk}]}
        datatype: String
      - name: tenant_id
        expression: {dialects: [{dialect: ANSI_SQL, expression: tenant_id}]}
        datatype: String
      - name: claim_status
        expression: {dialects: [{dialect: ANSI_SQL, expression: claim_status}]}
        datatype: String
      - name: service_dt
        expression: {dialects: [{dialect: ANSI_SQL, expression: service_dt}]}
        datatype: Date
        dimension: {is_time: true}
      - name: denied_claim
        expression: {dialects: [{dialect: ANSI_SQL, expression: denied_claim}]}
        datatype: Integer
      - name: adjudicated_claim
        description: 1 for paid or denied claims; pending claims are 0.
        expression: {dialects: [{dialect: ANSI_SQL, expression: adjudicated_claim}]}
        datatype: Integer

  - name: patient
    source: iceberg.marts.dim_patient
    primary_key: [patient]
    description: Current version of each patient.
    fields:
      - name: patient
        expression: {dialects: [{dialect: ANSI_SQL, expression: patient_hk}]}
        datatype: String
      - name: gender
        expression: {dialects: [{dialect: ANSI_SQL, expression: gender}]}
        datatype: String
      - name: city
        expression: {dialects: [{dialect: ANSI_SQL, expression: city}]}
        datatype: String

relationships:
  - name: encounter_to_patient
    from: encounter
    to: patient
    from_columns: [patient]
    to_columns: [patient]
  - name: claim_to_patient
    from: claim
    to: patient
    from_columns: [patient]
    to_columns: [patient]

metrics:
  - name: encounter_count
    description: Number of encounters.
    datatype: Integer
    custom_extensions:
      - vendor_name: SUPERSET
        data: '{"d3format": ",d"}'
    expression: {dialects: [{dialect: ANSI_SQL, expression: COUNT(encounter.*)}]}

  - name: active_patients
    description: Distinct patients with at least one encounter in the period.
    datatype: Integer
    custom_extensions:
      - vendor_name: SUPERSET
        data: '{"d3format": ",d"}'
    expression: {dialects: [{dialect: ANSI_SQL, expression: COUNT(DISTINCT encounter.patient_hk)}]}

  - name: avg_length_of_stay_days
    description: Average inpatient length of stay, in days.
    datatype: Decimal
    custom_extensions:
      - vendor_name: SUPERSET
        data: '{"d3format": ".2f"}'
    expression: {dialects: [{dialect: ANSI_SQL, expression: (SUM(encounter.length_of_stay_days)) / (SUM(encounter.inpatient_stay))}]}

  - name: readmission_rate_30d
    description: Share of inpatient stays followed by another inpatient admission within 30 days of discharge.
    datatype: Decimal
    custom_extensions:
      - vendor_name: SUPERSET
        data: '{"d3format": ".1%"}'
    expression: {dialects: [{dialect: ANSI_SQL, expression: (SUM(encounter.readmitted_30d)) / (SUM(encounter.inpatient_stay))}]}

  - name: claim_denial_rate
    description: Denied claims over adjudicated (paid or denied) claims. Pending claims are excluded.
    datatype: Decimal
    custom_extensions:
      - vendor_name: SUPERSET
        data: '{"d3format": ".2%"}'
    expression: {dialects: [{dialect: ANSI_SQL, expression: (SUM(claim.denied_claim)) / (SUM(claim.adjudicated_claim))}]}
